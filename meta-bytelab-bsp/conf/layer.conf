# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-bytelab-bsp"
BBFILE_PATTERN_meta-bytelab-bsp = "^${LAYERDIR}/"

# NOTE: Priority is deliberately ABOVE every third-party BSP layer we compose
#       with. Verified at the pinned commits: meta-raspberrypi is
#       BBFILE_PRIORITY 9, meta-rockchip is 1. A Byte Lab layer at 6 (as in the
#       reference project) would silently lose to meta-raspberrypi for any
#       same-named recipe. Check the vendor layer's priority before adding a new
#       one rather than assuming, because they do not agree with each other.
BBFILE_PRIORITY_meta-bytelab-bsp = "10"

# NOTE: Depends on "core" ONLY. The reference project's equivalent layer declares
#       LAYERDEPENDS = "core rockchip", which makes the supposedly reusable BSP
#       layer unbuildable unless meta-rockchip is present -- exactly what stops
#       it being reused. Vendor coupling belongs in the per-machine conf, which
#       is parsed only when that MACHINE is selected.
LAYERDEPENDS_meta-bytelab-bsp = "core"
LAYERSERIES_COMPAT_meta-bytelab-bsp = "wrynose"
