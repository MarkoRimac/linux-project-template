#@TYPE: Machine
#@NAME: qemuarm64-bytelab
#@DESCRIPTION: Emulated aarch64 target used as the CI boot gate.
#
# Copyright (c) Byte Lab Grupa d.o.o.
#
# Boots under `runqemu`, so CI can assert that the image reaches a login prompt
# rather than only that it compiled. No hardware and no third-party BSP layer,
# which makes this the cheapest way to prove the build host is sane.
#
# Tune is cortexa57 (inherited from openembedded-core's qemuarm64.conf). Note
# that rpi5-devkit is cortexa76 and rk3576-sige5 is cortexa72-cortexa53-crypto,
# so these three machines share no target sstate -- only native and cross
# artifacts are reused between them.

require conf/machine/qemuarm64.conf
require conf/machine/include/common.inc

# SERIAL_CONSOLES is inherited from qemuarm64.conf as
# "115200;ttyAMA0 115200;hvc0". It is stated per-machine on purpose: rpi5-devkit
# uses ttyAMA10 and rk3576-sige5 uses ttyFIQ0. Console selection must never
# leak into the distro conf.
