#@TYPE: Machine
#@NAME: rk3576-devkit
#@DESCRIPTION: Rockchip RK3576 (4x Cortex-A72 + 4x Cortex-A53). THE REAL TARGET.
#
# Copyright (c) Byte Lab Grupa d.o.o.
#
# STATUS: build-only. No RK3576 board has arrived yet, so this machine has never
# been booted and nothing below is verified against hardware. `bitbake
# bytelab-image` reaching do_image_wic is the most this can currently prove.
#
# This -- not rpi5-devkit -- is the machine docs/ARCHITECTURE.md and
# docs/ADDING-A-BOARD.md are written from. It has the full chain:
#   BootROM -> TPL (DDR init blob) -> SPL -> TF-A BL31 -> OP-TEE BL32 -> U-Boot
#   -> kernel, with loader1/loader2 in the GPT and MaskROM + rkdeveloptool for
#   recovery flashing.
#
# UPSTREAM DOES NOT CARRY THIS SoC. meta-rockchip's wrynose branch has no
# rk3576 support of any kind: no conf/machine/include/rk3576.inc, no EVB machine
# and no rkbin entries. `grep -ri 3576` over the pinned layer returns nothing.
# kas/machine/rk3576.yml therefore applies patches/0001-meta-rockchip-add-rk3576-support.patch,
# which adds the SoC include and the three prebuilt blobs. Without that patch
# the `require` below fails at parse time.
#
# Unlike rpi5-devkit there is no MACHINEOVERRIDES prepend here, because this
# machine is not derived from a vendor machine conf. It requires the SoC include
# directly, so there is no vendor machine name whose overrides we would miss.

require conf/machine/include/rk3576.inc
require conf/machine/include/common.inc

# Rockchip boots via U-Boot and needs a device tree on the boot media, so unlike
# rpi5-devkit this machine does want the bootloader as an essential dependency.
MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "u-boot kernel-devicetree"

# NOTE: Rockchip's FIQ debugger console. Setting it here also adds the device to
#       the pam_securetty allowlist, so it has a security implication on a
#       shipped product -- review before release.
# WARNING: meta-rockchip's rockchip-defaults.inc defaults this to
#          "1500000;ttyS2" and derives RK_CONSOLE_BAUD and RK_CONSOLE_DEVICE
#          from it, which in turn drive the TF-A baudrate fixup and the extlinux
#          console argument. Changing the console here changes all three.
SERIAL_CONSOLES = "115200;ttyFIQ0"

# Mainline has only skeletal RK3576 support, so the peripherals need the vendor
# tree. See recipes-kernel/linux/linux-rockchip.inc for what that costs and the
# open question about tracking a community fork.
PREFERRED_PROVIDER_virtual/kernel = "linux-rockchip"

# TODO(board): the two lines below are the ONLY board-specific settings in this
#              file, and both are unfillable until it is confirmed which RK3576
#              devkit was ordered. Everything above is SoC-level and correct for
#              any RK3576 board.
#
#              KERNEL_DEVICETREE names a .dtb that linux-rockchip.inc must also
#              be taught to build; see the DEVICE TREE section in that file.
#              UBOOT_MACHINE names a defconfig that must exist in the U-Boot
#              version being built -- check before assuming it is there.
#
#              For the Luckfox Omni3576 the reference project uses:
#                KERNEL_DEVICETREE = "rockchip/rk3576-luckfox-omni3576.dtb"
#                UBOOT_MACHINE     = "omni3576-rk3576_defconfig"
#
# KERNEL_DEVICETREE = ""
# UBOOT_MACHINE = ""
