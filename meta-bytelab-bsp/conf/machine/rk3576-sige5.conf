#@TYPE: Machine
#@NAME: rk3576-sige5
#@DESCRIPTION: Rockchip RK3576 on the ArmSoM Sige5 devkit. THE REAL TARGET.
#
# Copyright (c) Byte Lab Grupa d.o.o.
#
# STATUS: build-only. No RK3576 board is available yet, so this machine has
# never been booted. `bitbake bytelab-image` reaching do_image_wic on wrynose is
# what answers ROADMAP risk #2; booting it needs the devkit.
#
# This -- not rpi5-devkit -- is the machine that docs/ARCHITECTURE.md and
# docs/ADDING-A-BOARD.md are written from. It has the full chain:
#   BootROM -> TPL (DDR init blob) -> SPL -> TF-A BL31 -> OP-TEE BL32 -> U-Boot
#   -> kernel, with loader1/loader2 in the GPT and MaskROM + rkdeveloptool for
#   recovery flashing.
#
# Starting point is meta-rockchip's upstream EVB config, which on the wrynose
# branch sets UBOOT_MACHINE = "rk3576_defconfig", RK_UBOOT_SPL = "1" and
# KERNEL_DEVICETREE = "rockchip/rk3576-evb1-v10-linux.dtb".
#
# TODO(board): the Sige5 is not the EVB. Once hardware is in hand, replace the
# device tree with the Sige5 one and set the matching U-Boot defconfig. Telram's
# meta-bytelab-bsp/conf/machine/sige5-devkit.conf is the reference; it uses
# UBOOT_MACHINE = "sige5-rk3576_defconfig" and a vendor kernel
# (PREFERRED_PROVIDER_virtual/kernel = "linux-rockchip"). Decide deliberately
# whether the template tracks the vendor 6.1 fork or upstream -- ROADMAP rule 19
# leaves the kmeta-vs-defconfig rationale open pending Jakov.

require conf/machine/rockchip-rk3576-evb.conf
require conf/machine/include/common.inc

# Rockchip boots via U-Boot and needs a device tree on the boot media, so unlike
# rpi5-devkit this machine does want the bootloader as an essential dependency.
MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "u-boot kernel-devicetree"

# NOTE: Rockchip's FIQ debugger console. Setting it here also adds the device to
#       the pam_securetty allowlist, so it has a security implication on a
#       shipped product -- review before release. (Comment carried over from
#       Telram, where it is the model for this kind of annotation.)
SERIAL_CONSOLES = "115200;ttyFIQ0"
