#@TYPE: Machine
#@NAME: rpi5-devkit
#@DESCRIPTION: Raspberry Pi 5 (BCM2712, Cortex-A76). NON-PRODUCT TARGET.
#
# Copyright (c) Byte Lab Grupa d.o.o.
#
# NON-PRODUCT TARGET. NOT A REFERENCE FOR THE BOOT CHAIN.
#
# This machine exists so the SoC-agnostic parts of the template can be validated
# on real hardware without an SoC bring-up. Byte Lab ships Rockchip; see
# rk3576-sige5.conf for the real target.
#
# What this board does NOT model, and therefore cannot teach:
#   - TF-A / BL31 and OP-TEE / BL32      (VideoCore firmware is closed)
#   - SPL / TPL and DDR init blobs       (supplied by the EEPROM bootloader)
#   - loader1 / loader2 GPT entries      (RPi uses a FAT boot partition)
#   - MaskROM entry and rkdeveloptool    (RPi flashes with bmaptool/dd)
#
# Boot flow here is: SoC ROM -> SPI EEPROM bootloader (VideoCore) -> config.txt
# -> kernel. Device tree selection is via config.txt/dtoverlay, which is NOT how
# Rockchip does it (KERNEL_DEVICETREE + UBOOT_EXTLINUX_FDTOVERLAYS).
#
# Do NOT set RPI_USE_U_BOOT. It stacks U-Boot on top of the closed firmware and
# produces a boot chain that is wrong for this board and wrong for RK3576.

# Deriving a machine from a vendor one means inheriting its overrides too.
# BitBake keys overrides on the machine NAME, so everything upstream writes as
# `VAR:raspberrypi5` is silently skipped when MACHINE is `rpi5-devkit` -- including
# `KBUILD_DEFCONFIG:raspberrypi5 = "bcm2712_defconfig"`,
# without which do_kernel_metadata fails outright. Every derived machine in the vendor layer does
# this; so must we.
MACHINEOVERRIDES =. "raspberrypi5:"

require conf/machine/raspberrypi5.conf
require conf/machine/include/common.inc

# meta-raspberrypi's raspberrypi5.conf already sets SERIAL_CONSOLES to
# "115200;ttyAMA10". ttyAMA10 rather than ttyAMA0 is an RP1 southbridge quirk;
# on the 3-pin debug UART header this is the port you get.

# Default IMAGE_FSTYPES from rpi-base.inc is
# "tar.bz2 ext3 wic.bz2 wic.bmap" with WKS_FILE = "sdimage-raspberrypi.wks".
# The .wic.bmap is what makes `bmaptool copy` fast; keep both.
