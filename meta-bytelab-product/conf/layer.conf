# See docs/ADDING-A-BOARD.md.
#

# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-bytelab-product"
BBFILE_PATTERN_meta-bytelab-product = "^${LAYERDIR}/"

# One above meta-bytelab-bsp (10), which is itself above the vendor BSP layers
# (meta-raspberrypi and meta-rockchip are both 9). The product layer wins over
# everything, which is what lets a product override BSP defaults.
BBFILE_PRIORITY_meta-bytelab-product = "11"

LAYERDEPENDS_meta-bytelab-product = "core meta-bytelab-bsp"
LAYERSERIES_COMPAT_meta-bytelab-product = "wrynose"
