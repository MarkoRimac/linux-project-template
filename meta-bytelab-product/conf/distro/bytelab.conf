#
# Byte Lab base distribution. Deliberately minimal and machine-neutral: nothing
# in this file may assume a SoC, a bootloader, a console or a graphics stack.
#

DISTRO = "bytelab"
DISTRO_NAME = "Byte Lab Linux"
DISTRO_VERSION = "0.1.0"

# NOTE: Kept deliberately small. The reference project's product distro carries
#         "systemd pam ipv4 ipv6 wifi bluetooth 3g usbgadget usbhost opengl
#          vulkan wayland"
#       which drags in mesa, wayland and weston. A boot template does not need
#       a graphics stack, and building one is a large slice of first-build wall
#       time. Add graphics per-product, or via a kas/variant/ overlay.
#
#       Leaving out wifi/bluetooth also avoids pulling in
#       linux-firmware-rpidistro on Raspberry Pi, which would otherwise require
#       LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch".
DISTRO_FEATURES = "systemd pam ipv4 ipv6 usbhost"

INIT_MANAGER = "systemd"

# ipk is smaller and faster on target than rpm. This diverges from the reference project, which
# leaves the openembedded-core default (package_rpm) in place.
# TODO(review): confirm with Jakov before this becomes a Byte Lab rule.
PACKAGE_CLASSES ?= "package_ipk"

# Software bill of materials. Release builds keep this on; kas/variant/debug.yml
# removes it to keep development builds fast.
INHERIT += "create-spdx"

# Every LICENSE_FLAGS_ACCEPTED entry must be justified in a comment, per
# ROADMAP section 4 rule 15, and belongs in the machine or variant fragment that
# needs it -- never here, where it would apply to every product.
