#
# Machine #2: Rockchip RK3576. THIS IS THE REAL TARGET.
#
# Build-only until the ordered devkit arrives. `bitbake bytelab-image` reaching
# do_image_wic on wrynose is what answers the "does RK3576 work on wrynose 6.0"
# risk. Booting it, and therefore verifying anything about the boot chain,
# requires the board.
#
# UPSTREAM HAS NO RK3576. Verified against the pinned commit below: `grep -ri
# 3576` over meta-rockchip returns nothing at all. There is no
# conf/machine/include/rk3576.inc, no EVB machine conf, and no rkbin entries for
# the DDR, BL31 or BL32 blobs. rk3588/rk3588s/rk3568/rk3566/rk3308 are present;
# rk3576 and rk3506 are not.
#
# So the patch below is not optional and not a convenience: without it,
# rk3576-devkit.conf fails at parse time on its `require`.
#
# The patch is a rebase of the reference project's equivalent, not a copy. Two
# things changed on wrynose and both matter:
#   1. The rkbin recipes were refactored from per-SoC do_deploy() overrides to
#      variables (RKBIN_BINVERS / RKBIN_BINFILE / RKBIN_DEPLOY_FILENAME), so
#      the additions are declarative and no longer accept a glob.
#   2. Because globs are gone, the blob filenames must be exact. They are taken
#      from the rkbin SRCREV that meta-rockchip pins (f43a462e): DDR v1.09,
#      BL31 v1.15, BL32 v1.05. The reference's v1.08 DDR blob does not exist at
#      that revision, so copying its patch verbatim would fail the fetch.
#
# u-boot-rockchip.inc needed no change: BL31 now deploys to a generic path and
# ROCKCHIP_TPL is derived from SOC_FAMILY, both of which resolve for rk3576.
#

header:
  version: 19
  includes:
    - kas/base.yml

machine: rk3576-devkit
target: bytelab-image

repos:
  # NOTE: LAYERDEPENDS_rockchip = "core meta-arm". It does NOT depend on
  #       meta-oe, so meta-arm below is a hard requirement rather than a
  #       convenience. Its BBFILE_PRIORITY is 1, well below meta-bytelab-bsp's
  #       10, so our overrides win.
  meta-rockchip:
    url: https://git.yoctoproject.org/meta-rockchip
    branch: wrynose
    commit: 9d02575bfd9ca5e87c394f593f2bbdbdee914d4e
    patches:
      0001-rk3576-support:
        repo: meta-local
        path: patches/0001-meta-rockchip-add-rk3576-support.patch

  meta-arm:
    url: https://git.yoctoproject.org/meta-arm.git
    branch: wrynose
    commit: 0979b80429099f1a42dc0026c8c466cee780bc74
    layers:
      meta-arm:
      meta-arm-toolchain:
