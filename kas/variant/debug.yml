#
# Development variant: overlay only, no machine or repo of its own.
#
#   kas-container build kas/machine/rpi5.yml:kas/variant/debug.yml
#
# Builds the debug image (serial autologin, empty root password, gdbserver,
# systemtap, extra rootfs headroom for `devtool deploy-target`) and skips SBOM
# generation to keep the edit-build-flash loop short.
#
# WARNING: this image has no root password and permits root login. It is for
# devkits on a desk. Never ship it; use kas/variant/release.yml.
#

header:
  version: 19

target: bytelab-image-debug

local_conf_header:
  build: |
    # Disable SBOM generation to speed up development builds.
    INHERIT:remove = "create-spdx"
